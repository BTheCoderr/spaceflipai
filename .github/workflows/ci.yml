name: SpaceFlip CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Expo dependency compatibility
        run: npx expo install --check

      - name: Expo project health
        run: npx --yes expo-doctor@1.20.4

      # npm currently reports high-severity findings inside the Expo/React Native
      # dependency tree that only resolve by forcing an unsupported SDK jump.
      # Keep those visible in CI, but do not mutate the lockfile or break the
      # SDK 54 dependency set automatically.
      - name: Production dependency audit report
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Critical vulnerability gate
        run: npm audit --omit=dev --audit-level=critical

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Edge Function type check
        run: npm run functions:check
